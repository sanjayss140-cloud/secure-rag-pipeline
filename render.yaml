services:
  # FastAPI Backend Web Service
  - type: web
    name: mayandi
    env: docker
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: securerag-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: MAX_FILE_SIZE_MB
        value: 10

databases:
  # Managed PostgreSQL Database
  - name: securerag-postgres
    plan: free
    region: oregon
    databaseName: securerag
    user: postgres
