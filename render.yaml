services:
  # Mayandi AI - Multimodal Document Intelligence & RAG Service
  - type: web
    name: mayandi
    env: docker
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: JWT_SECRET
        generateValue: true
      - key: MAX_FILE_SIZE_MB
        value: 10
      - key: PORT
        value: 8000
